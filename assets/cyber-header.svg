<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Hi, I'm sevetar — cyber neko terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090014"/>
      <stop offset="0.52" stop-color="#1c0b35"/>
      <stop offset="1" stop-color="#380d35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#a78bfa" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1.5H900" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="900" height="220" rx="20" fill="url(#bg)"/>
  <circle cx="760" cy="70" r="110" fill="#ff4fa3" opacity=".12" filter="url(#soft)"/>
  <circle cx="110" cy="210" r="120" fill="#22d3ee" opacity=".08" filter="url(#soft)"/>
  <rect width="900" height="220" rx="20" fill="url(#grid)"/>
  <rect width="900" height="220" rx="20" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="218" rx="19" fill="none" stroke="url(#neon)" stroke-opacity=".75" stroke-width="2"/>

  <g transform="translate(28 24)">
    <circle cx="7" cy="7" r="5" fill="#ff4fa3"/>
    <circle cx="25" cy="7" r="5" fill="#facc15"/>
    <circle cx="43" cy="7" r="5" fill="#4ade80"/>
    <text x="64" y="12" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">sevetar@github: ~/profile</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="88" fill="#fff" font-size="38" font-weight="700">Hi, I'm <tspan fill="#ff4fa3">sevetar</tspan></text>
    <rect x="49" y="103" width="405" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
    <text x="49" y="137" fill="#c4b5fd" font-size="15" letter-spacing="2">AUTUMN RECRUITMENT // SYSTEM ONLINE</text>
    <text x="49" y="169" fill="#67e8f9" font-size="13">$ ./waiting_for_offer.exe <tspan fill="#4ade80">[ RUNNING ]</tspan></text>
    <rect x="49" y="183" width="94" height="22" rx="11" fill="#ff4fa3" fill-opacity=".14" stroke="#ff4fa3" stroke-opacity=".7"/>
    <text x="63" y="198" fill="#f9a8d4" font-size="10" font-weight="700">OPEN_TO_WORK</text>
    <rect x="151" y="183" width="80" height="22" rx="11" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".65"/>
    <text x="169" y="198" fill="#67e8f9" font-size="10" font-weight="700">SSH : 22</text>
  </g>

  <g transform="translate(650 29)" filter="url(#glow)">
    <path d="M36 46 55 10l27 29M128 39l27-29 19 36" fill="#1c0b35" stroke="#ff4fa3" stroke-width="4" stroke-linejoin="round"/>
    <rect x="24" y="39" width="162" height="132" rx="24" fill="#0b0615" stroke="url(#neon)" stroke-width="4"/>
    <rect x="37" y="54" width="136" height="94" rx="14" fill="#10091f" stroke="#a78bfa" stroke-opacity=".55"/>
    <path d="M63 92h23M124 92h23" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <path d="m96 113 9 6 9-6M105 119v7" fill="none" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 120 39 115M65 130l-26 3M146 120l26-5M145 130l27 3" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <path d="M79 171v16h52v-16M65 188h80" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <circle cx="181" cy="54" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#ff4fa3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" opacity=".8">
    <text x="846" y="193">01</text><text x="823" y="207">NEKO</text>
  </g>
</svg>
