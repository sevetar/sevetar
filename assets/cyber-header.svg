<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Hi, I'm sevetar — 秋招中">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090014"/>
      <stop offset="0.52" stop-color="#1c0b35"/>
      <stop offset="1" stop-color="#380d35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#a78bfa" stroke-opacity=".11"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" rx="20" fill="url(#bg)"/>
  <rect width="900" height="180" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="178" rx="19" fill="none" stroke="url(#neon)" stroke-opacity=".8" stroke-width="2"/>

  <g transform="translate(28 20)">
    <circle cx="7" cy="7" r="5" fill="#ff4fa3"/>
    <circle cx="25" cy="7" r="5" fill="#facc15"/>
    <circle cx="43" cy="7" r="5" fill="#4ade80"/>
    <text x="64" y="12" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">sevetar@github: ~/profile</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="91" fill="#fff" font-size="39" font-weight="700">Hi, I'm <tspan fill="#ff4fa3">sevetar</tspan></text>
    <rect x="49" y="106" width="405" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
    <text x="49" y="142" fill="#67e8f9" font-size="17">秋招中...</text>
  </g>

  <g transform="translate(680 10)" filter="url(#glow)">
    <path d="M27 47 47 13l25 28M121 41l25-28 20 34" fill="#1c0b35" stroke="#ff4fa3" stroke-width="4" stroke-linejoin="round"/>
    <rect x="17" y="40" width="162" height="123" rx="24" fill="#0b0615" stroke="url(#neon)" stroke-width="4"/>
    <rect x="30" y="55" width="136" height="85" rx="14" fill="#10091f" stroke="#a78bfa" stroke-opacity=".55"/>
    <path d="M56 91h23M117 91h23" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <path d="m89 111 9 6 9-6M98 117v7" fill="none" stroke="#ff4fa3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M57 119 33 114M58 129l-25 3M139 119l26-5M138 129l27 3" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
    <circle cx="174" cy="55" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
