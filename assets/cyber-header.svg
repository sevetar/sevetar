<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Hi, I'm sevetar — 秋招中">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090014"/>
      <stop offset="0.52" stop-color="#1c0b35"/>
      <stop offset="1" stop-color="#380d35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#a78bfa" stroke-opacity=".11"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="180" rx="20" fill="url(#bg)"/>
  <rect width="900" height="180" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="178" rx="19" fill="none" stroke="url(#neon)" stroke-opacity=".8" stroke-width="2"/>

  <g transform="translate(28 20)">
    <circle cx="7" cy="7" r="5" fill="#ff4fa3"/>
    <circle cx="25" cy="7" r="5" fill="#facc15"/>
    <circle cx="43" cy="7" r="5" fill="#4ade80"/>
    <text x="64" y="12" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">sevetar@github: ~/profile</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="91" fill="#fff" font-size="39" font-weight="700">Hi, I'm <tspan fill="#ff4fa3">sevetar</tspan></text>
    <rect x="49" y="106" width="405" height="3" rx="1.5" fill="url(#neon)" filter="url(#glow)"/>
    <text x="49" y="142" fill="#67e8f9" font-size="17">秋招中...</text>
  </g>

  <g transform="translate(669 13)" filter="url(#glow)">
    <rect x="9" y="7" width="198" height="147" rx="13" fill="#0b0615" stroke="url(#neon)" stroke-width="3"/>
    <path d="M9 34V20q0-13 13-13h17M177 7h17q13 0 13 13v14M207 127v14q0 13-13 13h-17M39 154H22q-13 0-13-13v-14" fill="none" stroke="#67e8f9" stroke-width="4"/>

    <circle cx="78" cy="77" r="45" fill="#10091f" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/>
    <circle cx="78" cy="77" r="34" fill="none" stroke="#22d3ee" stroke-opacity=".28"/>
    <path d="M78 26v14M78 114v14M27 77h14M115 77h14" stroke="#ff4fa3" stroke-width="2"/>

    <path d="M48 75q2-31 30-34 27 3 31 34l-8 7H56z" fill="#2b2740" stroke="#c4b5fd" stroke-width="3" stroke-linejoin="round"/>
    <path d="M55 80h47v15L89 111H68L55 96z" fill="#090014" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
    <path d="M64 87h29M72 101h15" stroke="#ff4fa3" stroke-width="2" stroke-linecap="round"/>
    <path d="M103 69h17v10h-13" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linejoin="round"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="139" y="48" fill="#a1a1aa" font-size="9">EXTRACTION</text>
